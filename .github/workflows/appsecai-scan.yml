name: AppSecAI Security Analysis

on:
  workflow_dispatch:
    inputs:
      cve_id:
        description: 'CVE(s) to run — single ID or comma-separated list (e.g. CVE-2023-28709,CVE-2024-38286). Leave blank to run all pending CVEs.'
        required: false
        default: ''
      use_scraper:
        description: 'Scrape tomcat.apache.org for new CVEs before running. Has no effect if cve_id is filled in — explicit CVE IDs always take priority.'
        type: boolean
        default: false

concurrency:
  group: appsecai-scan
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI CLIs for council
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @openai/codex

      - name: Capture run time
        id: run-time
        run: echo "run_time=$(date -u +%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Capture AppSecAI system version
        id: version
        run: |
          VERSION=$(curl -sf https://api.cloud.appsecai.io/api/health/version \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" || echo "unknown")
          echo "system_version=$VERSION" >> $GITHUB_OUTPUT
          echo "AppSecAI system version: $VERSION"

      - name: Scrape new CVEs
        if: inputs.use_scraper == true && inputs.cve_id == ''
        run: |
          python scripts/scrape_candidates.py \
            --fixes-dir fixes \
            --benchmark-dir benchmark \
            --limit 100 \
            --out cve_candidates.json

      - name: Determine CVEs to process
        id: resolve-cves
        env:
          CVE_INPUT: ${{ inputs.cve_id }}
          USE_SCRAPER: ${{ inputs.use_scraper }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from list_pending_cves import list_pending_cves

          CVE_RE = re.compile(r'^CVE-\d{4}-\d+$')
          CVE_LIMIT = 100

          raw_input = os.environ.get('CVE_INPUT', '').strip()
          use_scraper = os.environ.get('USE_SCRAPER', 'false').lower() == 'true'

          if raw_input and use_scraper:
              print("WARNING: both use_scraper and cve_id provided — ignoring use_scraper, using cve_id")
              use_scraper = False

          if raw_input:
              cves = [c.strip() for c in raw_input.split(',') if c.strip()]
              invalid = [c for c in cves if not CVE_RE.match(c)]
              if invalid:
                  print(f"ERROR: invalid CVE ID format: {invalid}", file=sys.stderr)
                  sys.exit(1)
              # Warn if any CVE already has a complete benchmark entry
              meta_index = {p.parent.name: p for p in Path('benchmark').glob('*/CVE-*/metadata.json')}
              for cve_id in cves:
                  meta_path = meta_index.get(cve_id)
                  if meta_path:
                      try:
                          meta = json.loads(meta_path.read_text())
                          runs = meta.get('runs', [])
                          if runs and runs[-1].get('pr_found', False):
                              print(f"WARNING: {cve_id} already has a complete benchmark entry — re-running may create a duplicate AppSecAI PR")
                      except Exception:
                          pass
          elif use_scraper:
              # Include CVEs from cve_candidates.json that have no fixes/ markdown yet
              # (newly scraped) plus existing pending ones (fixes/ exists but no PR).
              pending = list_pending_cves(Path('fixes'), Path('benchmark'))
              new_from_candidates = []
              candidates_path = Path('cve_candidates.json')
              if candidates_path.exists():
                  try:
                      candidates = json.loads(candidates_path.read_text(encoding='utf-8'))
                      existing_fixes = {
                          p.name.replace('_before_after.md', '')
                          for p in Path('fixes').glob('CVE-*_before_after.md')
                      }
                      new_from_candidates = [
                          c['cve_id'] for c in candidates
                          if c['cve_id'] not in existing_fixes
                      ]
                  except Exception as exc:
                      print(f"WARNING: could not read cve_candidates.json: {exc}", file=sys.stderr)
              cves = sorted(set(pending + new_from_candidates))[:CVE_LIMIT]
              if len(pending) + len(new_from_candidates) > CVE_LIMIT:
                  print(f"NOTE: {len(pending) + len(new_from_candidates)} CVEs available; capped at {CVE_LIMIT}")
          else:
              cves = list_pending_cves(Path('fixes'), Path('benchmark'))[:CVE_LIMIT]

          if not cves:
              print("No CVEs to process.")
          else:
              print(f"CVEs to process ({len(cves)}): {cves}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"cve_list={','.join(cves)}\n")
              f.write(f"has_cves={'true' if cves else 'false'}\n")
          PYEOF

      - name: Generate fix markdowns via Claude
        if: steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
        run: |
          for cve in $(echo "$CVE_LIST" | tr ',' ' '); do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]+$ ]] || { echo "Skipping invalid token: $cve"; continue; }
            md="fixes/${cve}_before_after.md"
            if [ ! -f "$md" ]; then
              echo "Generating markdown for $cve ..."
              python scripts/generate_markdown.py \
                --cve-id "$cve" \
                --candidates cve_candidates.json \
                --fixes-dir fixes \
                --tomcat-repo https://github.com/apache/tomcat.git \
                || echo "WARNING: generate_markdown failed for $cve, continuing"
            else
              echo "Markdown already exists for $cve, skipping."
            fi
          done

      - name: Generate SARIF files
        if: steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
        run: |
          python scripts/sarif_generator.py \
            --fixes-dir fixes \
            --sarif-dir sarif \
            --cve-ids "$CVE_LIST"

      - name: Build SARIF file list
        id: sarif-list
        if: steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
        run: |
          python3 - <<'PYEOF'
          import os
          from pathlib import Path
          cves = [c for c in os.environ['CVE_LIST'].split(',') if c]
          all_files = [f"sarif/{cve}.sarif" for cve in cves]
          files = [f for f in all_files if Path(f).exists()]
          missing = set(all_files) - set(files)
          if missing:
              print(f"WARNING: {len(missing)} SARIF file(s) not found (skipping): {sorted(missing)}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("sarif_files<<EOF\n")
              f.write("\n".join(files) + "\n")
              f.write("EOF\n")
          print(f"SARIF files ({len(files)}): {files}")
          PYEOF

      - name: AppSecAI Vulnerability Analysis
        if: steps.resolve-cves.outputs.has_cves == 'true'
        uses: AppSecureAI/automation-action@v1
        with:
          files: ${{ steps.sarif-list.outputs.sarif_files }}

      - name: Organize benchmark data
        if: steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for cve in $(echo "$CVE_LIST" | tr ',' ' '); do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]+$ ]] || { echo "Skipping invalid token: $cve"; continue; }
            python scripts/organize_benchmark.py \
              --cve-id "$cve" \
              --fixes-dir fixes \
              --candidates cve_candidates.json \
              --benchmark-dir benchmark \
              --repo "${{ github.repository }}" \
              --system-version "${{ steps.version.outputs.system_version }}" \
              --run-time "${{ steps.run-time.outputs.run_time }}" \
              || echo "WARNING: organize_benchmark failed for $cve, continuing"
          done

      - name: Generate all_fixes.md files
        if: steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for cve in $(echo "$CVE_LIST" | tr ',' ' '); do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]+$ ]] || { echo "Skipping invalid token: $cve"; continue; }
            python scripts/generate_all_fixes.py \
              --cve-id "$cve" \
              --repo "${{ github.repository }}" \
              --fixes-dir fixes \
              --benchmark-dir benchmark \
              || echo "WARNING: generate_all_fixes failed for $cve, continuing"
          done

      - name: Run council of experts
        if: steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex
          echo "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          for cve in $(echo "$CVE_LIST" | tr ',' ' '); do
            [[ "$cve" =~ ^CVE-[0-9]{4}-[0-9]+$ ]] || { echo "Skipping invalid token: $cve"; continue; }
            python scripts/run_council.py "$cve" \
              || echo "WARNING: run_council failed for $cve, continuing"
          done

      - name: Commit and push all generated files
        if: success() && steps.resolve-cves.outputs.has_cves == 'true'
        env:
          CVE_LIST: ${{ steps.resolve-cves.outputs.cve_list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --autostash origin/main
          git add fixes/ sarif/ benchmark/ cve_candidates.json
          N=$(echo "$CVE_LIST" | tr ',' '\n' | wc -l | tr -d ' ')
          git diff --cached --quiet || git commit -m "chore: pipeline run for ${N} CVE(s) [skip ci]"
          git push
